name: permguard-atlas-commerce

services:
  permguard:
    image: ${PERMGUARD_REGISTRY:-permguard}/all-in-one:${PERMGUARD_VERSION:-latest}
    command: ["/etc/permguard/config.yml"]
    environment:
      PERMGUARD_WORKING_DIR: /var/lib/permguard
      PERMGUARD_TELEMETRY_ADDR: 0.0.0.0:5543
      PERMGUARD_TELEMETRY_ADVERTISED_URL: http://127.0.0.1:5543
      PERMGUARD_CONTROL_HTTP_ADDR: 0.0.0.0:6543
      PERMGUARD_CONTROL_HTTP_ADVERTISED_URL: http://127.0.0.1:6543
      PERMGUARD_CONTROL_GRPC_ADDR: 0.0.0.0:6543
      PERMGUARD_DATA_HTTP_ADDR: 0.0.0.0:7543
      PERMGUARD_DATA_HTTP_ADVERTISED_URL: http://127.0.0.1:7543
      PERMGUARD_DATA_GRPC_ADDR: 0.0.0.0:7543
    volumes:
      - ./permguard/server.yml:/etc/permguard/config.yml:ro
      - permguard-data:/var/lib/permguard
    ports:
      - "127.0.0.1:5543:5543"
      - "127.0.0.1:6543:6543"
      - "127.0.0.1:7543:7543"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  toolbox:
    image: permguard-atlas-toolbox:${PERMGUARD_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
      args:
        PERMGUARD_REGISTRY: ${PERMGUARD_REGISTRY:-permguard}
        PERMGUARD_VERSION: ${PERMGUARD_VERSION:-latest}
    profiles: [tools]
    depends_on:
      permguard:
        condition: service_started
    network_mode: service:permguard
    environment:
      PERMGUARD_HOST_ENDPOINT: http://127.0.0.1:5543
      PERMGUARD_CONTROL_ENDPOINT: http://127.0.0.1:6543
      PERMGUARD_DATA_ENDPOINT: http://127.0.0.1:7543
      PERMGUARD_ADMIN_ENDPOINT: https://127.0.0.1:5544
      PERMGUARD_TLS_CA_FILE: /var/lib/permguard/tls/ca.pem
    volumes:
      - ./permguard:/playground:ro
      - permguard-data:/var/lib/permguard:ro
    read_only: true
    tmpfs:
      - /work:uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/playground/scripts/docker-run.sh"]
    command: ["help"]

volumes:
  permguard-data:
