name: Checkout peak
description: >-
  The payment gateway at a Black Friday peak. Checkout services capture authorized payments for
  two merchants while a support integration reads orders; a small, steady share of calls is the
  abuse the gateway must refuse: over-captures, cross-merchant captures, staging workloads without
  mTLS, retries without an idempotency key and tokens with the wrong scope.

load:
  concurrency: 16
  rounds: 30
  warmup: 3
  pause: 1s

on_failure: continue

thresholds:
  p95_ms: 25
  p99_ms: 60
  errors: 0
  unexpected: 0

mix:
  - name: checkout captures the full authorized amount
    request: requests/capture-authorized.json
    weight: 45
    expect: { decision: permit, policies: [payment-capture-boundary] }

  - name: checkout captures part of a larger authorization
    request: requests/capture-partial.json
    weight: 15
    expect: { decision: permit, policies: [payment-capture-boundary] }

  - name: the support integration reads an order of its merchant
    request: requests/read-order-support.json
    weight: 25
    expect: { decision: permit, policies: [payment-capture-boundary] }

  - name: a capture above the authorized amount is refused
    request: requests/capture-over-authorized.json
    weight: 3
    expect: { decision: deny, policies: [] }

  - name: a capture against another merchant's authorization is refused
    request: requests/capture-cross-merchant.json
    weight: 3
    expect: { decision: deny, policies: [] }

  - name: a staging workload without verified mTLS cannot capture
    request: requests/capture-without-mtls.json
    weight: 3
    expect: { decision: deny, policies: [] }

  - name: a retry without an idempotency key cannot capture
    request: requests/capture-without-idempotency.json
    weight: 2
    expect: { decision: deny, policies: [] }

  - name: a token scoped to orders cannot capture payments
    request: requests/capture-wrong-scope.json
    weight: 2
    expect: { decision: deny, policies: [] }

  - name: the support integration cannot read another merchant's order
    request: requests/read-order-cross-merchant.json
    weight: 2
    expect: { decision: deny, policies: [] }
